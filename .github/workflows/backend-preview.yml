name: Backend Preview

on:
  pull_request:
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  backend-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Run backend tests
        run: go test ./...
