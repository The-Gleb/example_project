name: Android Preview

on:
  pull_request:
  workflow_dispatch:

jobs:
  android-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Android quality gate
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiny-clock-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Distribute via Firebase App Distribution
        if: ${{ env.FIREBASE_APP_ID != '' }}
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_TESTER_GROUPS: ${{ secrets.FIREBASE_TESTER_GROUPS }}
        run: |
          set -euo pipefail
          npm install -g firebase-tools >/dev/null
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          firebase appdistribution:distribute "$APK" \
            --app "$FIREBASE_APP_ID" \
            --token "$FIREBASE_TOKEN" \
            --groups "${FIREBASE_TESTER_GROUPS:-internal-testers}" \
            --release-notes "Preview build from ${GITHUB_SHA::8}"
